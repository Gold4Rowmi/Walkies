<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F26B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Walkies">
<title>Walkies</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Light unless the person has chosen dark. Set before paint, so there is no flash.
  try { document.documentElement.dataset.theme = localStorage.getItem('walkies_theme') || 'light'; }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>

<div id="app" class="app"><div class="screen center"><p class="meta">Loading…</p></div></div>

<div class="toast" id="toast" role="status"></div>

<dialog class="about" id="about">
  <svg class="px lock" width="117" height="30" viewBox="0 0 39 10" id="aboutLock" aria-label="ROWMI"></svg>
  <p><b>Walkies</b> version 1.0.0</p>
  <p>Playful tools with a lot of bark.</p>
  <p style="color:var(--muted)">Made in memory of Rommel.</p>
  <div class="row" style="margin-bottom:12px">
    <button class="btn" type="button" id="pushBtn" data-sfx="tick">Turn on notifications</button>
    <button class="btn" type="button" id="themeBtn" data-sfx="tick">Dark mode</button>
  </div>
  <form method="dialog"><button class="btn" type="submit" data-sfx="back">Close</button></form>
</dialog>

<div class="boot" id="boot" aria-label="Starting. Press anywhere to skip.">
  <svg viewBox="0 0 64 40" aria-hidden="true">
    <rect class="wipe" x="0" y="0" width="64" height="40" style="fill:var(--shell)"/>
    <g transform="translate(12 15)">
      <g id="bootDog"></g>
      <g class="bw" id="bootWord"></g>
      <g id="bootEmote" class="bemote">
        <rect x="4" y="-6" width="2" height="3" fill="#D9893B"/>
        <rect x="4" y="-2" width="2" height="1" fill="#D9893B"/>
      </g>
    </g>
    <text class="bname" x="32" y="35">Walkies</text>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
